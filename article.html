<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Dion Sherifi</title>
  <meta id="meta-description" name="description" content="Writing from Dion Sherifi — a full-stack developer from Ferizaj, Kosovo — on programming, competitions and building real projects." />
  <meta name="author" content="Dion Sherifi" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
  <meta name="theme-color" content="#0a0f1e" />

  <!-- ============ FAVICON ============ -->
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Canonical: built from ?slug= so each post canonicalises to itself,
       not to a shared, empty article.html -->
  <link rel="canonical" id="canonical-link" href="https://dionsherifi.com/" />

  <!-- ============ OPEN GRAPH ============ -->
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="Dion Sherifi" />
  <meta property="og:url" id="og-url" content="https://dionsherifi.com/" />
  <meta property="og:title" id="og-title" content="Blog — Dion Sherifi" />
  <meta property="og:description" id="og-description" content="Writing from Dion Sherifi — a full-stack developer from Ferizaj, Kosovo — on programming, competitions and building real projects." />
  <meta property="og:image" id="og-image" content="https://dionsherifi.com/images/og-card.png?v=2" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="sq_AL" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" id="twitter-image" content="https://dionsherifi.com/images/og-card.png?v=2" />

  <script>
    (function () {
      const slug = new URLSearchParams(window.location.search).get('slug');
      if (slug) {
        const url = 'https://dionsherifi.com/article.html?slug=' + encodeURIComponent(slug);
        document.getElementById('canonical-link').href = url;
        document.getElementById('og-url').content = url;
      }
    })();
  </script>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/pages/article.css" />
</head>
<body class="article-body">

  <!-- ============ NAVBAR (simplified - just brand + back) ============ -->
  <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
    <div class="container">
      <a class="navbar-brand brand-logo" href="index.html">
        <span class="bracket">&lt;</span>dionsherifi<span class="bracket">/&gt;</span>
      </a>

      <div class="ms-auto d-flex align-items-center gap-2">
        <a href="blog.html" class="back-link">
          <i class="bi bi-arrow-left"></i>
          <span data-i18n="article.back">Back to blog</span>
        </a>
        <button id="langToggle" class="lang-btn" aria-label="Change language">
          <i class="bi bi-globe2"></i> <span id="langLabel">SQ</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ============ ARTICLE ============ -->
  <main class="article-main">

    <!-- LOADING STATE -->
    <div id="article-loading" class="article-loading">
      <div class="spinner"></div>
      <p data-i18n="article.loading">Loading article…</p>
    </div>

    <!-- ERROR STATE -->
    <div id="article-error" class="article-error" hidden>
      <i class="bi bi-exclamation-circle"></i>
      <h2 data-i18n="article.errorTitle">Article not found</h2>
      <p data-i18n="article.errorText">The article you're looking for doesn't exist or has been moved.</p>
      <a href="blog.html" class="btn-primary-glow" data-i18n="article.errorBack">Back to blog</a>
    </div>

    <!-- ARTICLE CONTENT -->
    <article id="article-content" class="article-wrap" hidden>

      <!-- Cover image -->
      <div class="article-cover">
        <img id="article-cover-img" src="" alt="" />
      </div>

      <div class="container article-container">

        <!-- Category pill -->
        <div class="article-cat-wrap">
          <span id="article-category" class="article-category-pill">Hackathons</span>
        </div>

        <!-- Title -->
        <h1 id="article-title" class="article-title">Article title</h1>

        <!-- Meta row -->
        <div class="article-meta">
          <span class="meta-item">
            <i class="bi bi-person-circle"></i>
            <span data-i18n="article.author">By Dion Sherifi</span>
          </span>
          <span class="meta-dot">·</span>
          <span class="meta-item"><i class="bi bi-calendar3"></i> <span id="article-date">—</span></span>
          <span class="meta-dot">·</span>
          <span class="meta-item">
            <i class="bi bi-clock"></i>
            <span id="article-readtime">—</span> <span data-i18n="article.read">min read</span>
          </span>
        </div>

        <!-- Tags -->
        <div id="article-tags" class="article-tags"></div>

        <hr class="article-sep" />

        <!-- Body content -->
        <div id="article-body" class="article-body-content"></div>

        <!-- Gallery -->
        <div id="article-gallery" class="article-gallery"></div>

        <!-- Footer / share -->
        <div class="article-foot">
          <a href="blog.html" class="btn-ghost">
            <i class="bi bi-arrow-left"></i>
            <span data-i18n="article.back">Back to blog</span>
          </a>
        </div>

      </div>
    </article>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <span class="bracket">&lt;</span>dionsherifi<span class="bracket">/&gt;</span>
        </div>
        <p class="footer-text" data-i18n="footer.text">Designed &amp; built by Dion Sherifi</p>
        <p class="footer-copy">
          © <span id="year"></span> · <span data-i18n="footer.rights">All rights reserved</span>
        </p>
      </div>
    </div>
  </footer>

  <!-- Lightbox overlay -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox-close" aria-label="Close">
      <i class="bi bi-x-lg"></i>
    </button>
    <img id="lightbox-img" src="" alt="" />
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/article.js"></script>
</body>
</html>
